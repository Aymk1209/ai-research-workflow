    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <style>
        :root { --bg-primary: #0a0712; --bg-secondary: #120d24; --text-main: #f4f2f8; --text-muted: #a7a2ba; --accent-purple: #c084fc; --border-color: #2e2547; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 40px 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { margin-bottom: 40px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .badge { background: rgba(192, 132, 252, 0.1); color: var(--accent-purple); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; display: inline-block; margin-bottom: 12px; }
        h1 { font-size: 2.2rem; margin-bottom: 8px; background: linear-gradient(to right, #f4f2f8, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .panel { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 30px; }
        .panel-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        textarea { width: 100%; height: 140px; background: #02040a; border: 1px solid var(--border-color); padding: 14px; border-radius: 8px; color: #fff; font-size: 0.95rem; margin-bottom: 16px; line-height: 1.5; }
        .action-btn { background: #7c3aed; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .output-box { background: #02040a; border-left: 4px solid var(--accent-purple); padding: 20px; border-radius: 0 8px 8px 0; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; color: #cbd5e1; display: none; margin-top: 20px; line-height: 1.6; }
    </style>
</head>
